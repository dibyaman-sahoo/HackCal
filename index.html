<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HackCal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0404'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='monospace' font-size='30' font-weight='700' fill='%23ff3341'%3EH_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-rain" id="bootRain"></div>
    <div class="boot-inner">
      <div class="boot-title">WELCOME TO HACKCAL</div>
      <div class="boot-sub">Scientific Binary Calculator</div>
      <div class="boot-line">Initializing Binary Computation Engine<span class="dots"></span></div>
      <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
    </div>
  </div>

  <div class="logo">HACK<span>_</span>CAL</div>
  <div class="tagline">// scientific arithmetic unit</div>

  <div class="layout">
    <div class="calc">
      <div class="display">
        <div class="expr" id="exprLine">&nbsp;</div>
        <div class="result" id="resultLine">0<span class="cursor"></span></div>
      </div>
      <div class="pad" id="pad"></div>
    </div>

    <div class="panel">
      <h2>ALU / FPU TRACE — live binary execution</h2>
      <div class="trace" id="trace"><div class="idle">awaiting input...</div></div>
    </div>
  </div>
<script>
// Fullscreen toggle: F key, Esc key (desktop) + double-tap (mobile) — like YouTube
(function(){
  "use strict";

  function isTypingContext(el){
    if (!el) return false;
    var tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
  }

  function toggleFullscreen(){
    if (!document.fullscreenElement) {
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); // Safari/iOS
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    }
  }

  // ---- Desktop: F to toggle, Esc to exit ----
  document.addEventListener('keydown', function(e){
    if (isTypingContext(document.activeElement)) return;

    if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      toggleFullscreen();
    } else if (e.key === 'Escape' && document.fullscreenElement) {
      toggleFullscreen();
    }
  });

  // ---- Mobile: double-tap anywhere to toggle fullscreen ----
  var lastTapTime = 0;
  var lastTapX = 0;
  var lastTapY = 0;
  var DOUBLE_TAP_MS = 300;   // max gap between taps
  var DOUBLE_TAP_DIST = 40;  // max finger movement between taps (px)

  document.addEventListener('touchend', function(e){
    // Ignore taps on interactive elements (links, buttons, inputs)
    if (e.target.closest('a, button, input, textarea, select, [role="button"]')) {
      lastTapTime = 0; // reset so it doesn't chain into a nearby double-tap
      return;
    }

    var now = Date.now();
    var touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;

    var x = touch.clientX;
    var y = touch.clientY;
    var dx = Math.abs(x - lastTapX);
    var dy = Math.abs(y - lastTapY);

    if (now - lastTapTime < DOUBLE_TAP_MS && dx < DOUBLE_TAP_DIST && dy < DOUBLE_TAP_DIST) {
      e.preventDefault(); // stop the double-tap from also zooming the page
      toggleFullscreen();
      lastTapTime = 0; // reset so a third tap doesn't re-trigger
    } else {
      lastTapTime = now;
      lastTapX = x;
      lastTapY = y;
    }
  }, { passive: false });
})();
</script>
<script src="script.js"></script>
</body>
</html>
