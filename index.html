<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HackCal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0404'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='monospace' font-size='30' font-weight='700' fill='%23ff3341'%3EH_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-rain" id="bootRain"></div>
    <div class="boot-inner">
      <div class="boot-title">WELCOME TO HACKCAL</div>
      <div class="boot-sub">Scientific Binary Calculator</div>
      <div class="boot-line">Initializing Binary Computation Engine<span class="dots"></span></div>
      <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
    </div>
  </div>

  <div class="logo">HACK<span>_</span>CAL</div>
  <div class="tagline">// scientific arithmetic unit</div>

  <div class="layout">
    <div class="calc">
      <div class="display">
        <div class="expr" id="exprLine">&nbsp;</div>
        <div class="result" id="resultLine">0<span class="cursor"></span></div>
      </div>
      <div class="pad" id="pad"></div>
    </div>

    <div class="panel">
      <h2>ALU / FPU TRACE — live binary execution</h2>
      <div class="trace" id="trace"><div class="idle">awaiting input...</div></div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
