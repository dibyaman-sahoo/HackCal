<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HackCal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-rain" id="bootRain"></div>
    <div class="boot-inner">
      <div class="boot-title">WELCOME TO HACKCAL</div>
      <div class="boot-sub">Scientific Binary Calculator</div>
      <div class="boot-line">Initializing Binary Computation Engine<span class="dots"></span></div>
      <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
    </div>
  </div>

    <div class="logo">HACK<span>_</span>CAL</div>
  <div class="tagline">// scientific arithmetic unit</div>

    <div class="layout">
    <div class="calc">
      <div class="display">
        <div class="expr" id="exprLine">&nbsp;</div>
        <div class="result" id="resultLine">0<span class="cursor"></span></div>
      </div>
      <div class="pad" id="pad"></div>
    </div>
